        .lab-main {

            border-radius: 16px;
            background: var(--card-bg);

        .lab-archive h2 {
            margin: 0;
            border: 0;
            padding: 0;
            color: inherit;
            line-height: 1.5;
            text-align: left;
        }

<body>
    <nav>
